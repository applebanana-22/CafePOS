<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CafePOS App</title>
</head>
<body>
    <h1>Welcome to CafePOS</h1>
    <form method="POST">
        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name" required>
        <button type="submit">Submit</button>
    </form>
    {% if greeting %}
        <h2>{{ greeting }}</h2>
    {% endif %}
</body>
</html>
